<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collections - Mee Aakruthi</title>
    <meta name="description" content="Lookbook of couture, bridal, and ready-to-wear from Mee Aakruthi." />
    <link rel="icon" type="image/png" href="imgs/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html"><img src="imgs/logo.png" alt="Mee Aakruthi" /></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Open menu">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
      </button>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="collections.html" aria-current="page">Collections</a></li>
          <li><a href="about.html">Designer</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <div class="container">
        <p class="eyebrow">Lookbook</p>
        <h1 class="serif" style="font-size: clamp(2.6rem, 6vw, 4.6rem); margin: 0 0 1.5rem">
          Collections
        </h1>
        <div class="filters" role="toolbar" aria-label="Filter looks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="traditional" aria-pressed="false">Traditional</button>
          <button type="button" data-filter="fusion" aria-pressed="false">Fusion</button>
          <button type="button" data-filter="contemporary" aria-pressed="false">Contemporary</button>
        </div>
        <div class="collection-grid">
          <figure class="look-card" data-category="traditional">
            <img src="imgs/collections/1.jpg" alt="Cream lehenga with floral embroidery on a mannequin" />
            <figcaption>Look 01 · Floral lehenga · Cream silk</figcaption>
          </figure>
          <figure class="look-card" data-category="contemporary">
            <img src="imgs/collections/2.jpg" alt="High-waisted black wide pleated trousers" />
            <figcaption>Look 02 · Wide pleated trousers · Black</figcaption>
          </figure>
          <figure class="look-card" data-category="traditional">
            <img src="imgs/collections/3.jpg" alt="Rose pink and magenta lehenga with gold border" />
            <figcaption>Look 03 · Lehenga choli · Rose pink brocade</figcaption>
          </figure>
          <figure class="look-card" data-category="traditional">
            <img src="imgs/collections/4.jpeg" alt="Rust orange lehenga with metallic silver border" />
            <figcaption>Look 04 · Lehenga · Rust with metallic border</figcaption>
          </figure>
          <figure class="look-card" data-category="fusion">
            <img src="imgs/collections/5.jpeg" alt="Black cowl-neck tunic with zigzag trim" />
            <figcaption>Look 05 · Cowl-neck tunic · Draped front</figcaption>
          </figure>
          <figure class="look-card" data-category="contemporary">
            <img src="imgs/collections/6.jpeg" alt="Teal blue satin cocktail dress with pearl strap" />
            <figcaption>Look 06 · Cocktail dress · Teal satin</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <span>© 2026 Mee Aakruthi</span>
      <span>Sainikpuri, Secunderabad, India</span>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
